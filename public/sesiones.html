<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sesiones · Three Inmobiliaria</title>
<style>
  /* Panel de sesiones (reunión 30-10): lo que usan a diario Arkaitz, Marta y
     el equipo. Tres pestañas: Agendados (llamar y confirmar), No presentados
     (llamar para recuperar) y Descartados (solo a mano). El CRM técnico queda
     aparte en /monitor.html. */
  :root{--ink:#1d1640;--quiet:#6b6585;--line:#e6e1f2;--bg:#f7f5fc;--card:#fff;
    --ok:#1f8a4c;--okbg:#e5f6ec;--warn:#a86400;--warnbg:#fff3dc;--ko:#c0392b;--kobg:#fde8e6;--acc:#311B92}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  header{background:linear-gradient(135deg,var(--acc),#5b2fd1);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{margin:0;font-size:1.3rem}
  header a{color:#fff;opacity:.8;font-size:.85rem}
  main{max-width:1000px;margin:0 auto;padding:16px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tab{flex:1;min-width:150px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit}
  .tab b{display:block;font-size:1.6rem}
  .tab span{color:var(--quiet);font-size:.85rem}
  .tab.activa{border-color:var(--acc);background:#f1edfb}
  .tab .aviso{display:block;color:var(--ko);font-size:.78rem;margin-top:2px}
  .explica{color:var(--quiet);font-size:.9rem;margin:0 0 12px}
  .nota{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:.9rem}
  .persona{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:12px 14px}
  .fila{display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer}
  .nombre{font-weight:700}
  .cuando{color:var(--acc);font-weight:600;font-size:.9rem}
  .tel{color:var(--quiet);font-size:.88rem}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:.75rem;padding:3px 8px;border-radius:999px;background:#eee;color:#444;white-space:nowrap}
  .chip.ok{background:var(--okbg);color:var(--ok)} .chip.warn{background:var(--warnbg);color:var(--warn)} .chip.ko{background:var(--kobg);color:var(--ko)}
  .acciones{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  button,.btn{font:inherit;font-size:.85rem;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-block}
  button:hover,.btn:hover{border-color:var(--acc)}
  .prim{background:var(--acc);color:#fff;border-color:var(--acc)}
  .verde{background:var(--ok);color:#fff;border-color:var(--ok)}
  .rojo{color:var(--ko)}
  .detalle{display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
  .persona.abierta .detalle{display:block}
  .cols{display:grid;grid-template-columns:1fr 1.3fr;gap:16px}
  @media (max-width:760px){.cols{grid-template-columns:1fr}}
  h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.5px;color:var(--quiet);margin:4px 0 8px}
  .pasos{list-style:none;margin:0;padding:0}
  .pasos li{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:.88rem}
  .pasos .ts,.pasos .det{color:var(--quiet);font-size:.78rem;display:block}
  .chat{max-height:300px;overflow:auto;background:#faf9fd;border:1px solid var(--line);border-radius:10px;padding:8px}
  .msg{max-width:85%;margin:6px 0;padding:7px 10px;border-radius:10px;font-size:.86rem;white-space:pre-wrap;word-wrap:break-word}
  .msg.lead{background:#fff;border:1px solid var(--line)} .msg.sistema{background:#e9e3fb;margin-left:auto} .msg.crm{background:#dff3e8;margin-left:auto}
  .msg small{display:block;color:var(--quiet);font-size:.72rem;margin-top:3px}
  .dudas{background:var(--warnbg);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.88rem}
  .llamadas{font-size:.85rem;color:var(--quiet);margin-top:6px}
  .escribir{display:flex;gap:6px;margin-top:8px}
  .escribir textarea{flex:1;font:inherit;font-size:.86rem;border:1px solid var(--line);border-radius:8px;padding:8px;min-height:42px}
  .vacio{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--quiet)}
  #toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;display:none;max-width:90%;z-index:9}
</style>
</head>
<body>
<header><h1>📅 Sesiones de dudas</h1><a href="/monitor.html">CRM completo →</a></header>
<main>
  <div class="tabs" id="tabs"></div>
  <p class="explica" id="explica"></p>
  <div id="nota"></div>
  <div id="lista"></div>
</main>
<div id="toast"></div>

<script>
const PESTANAS = {
  agendados:     { titulo: 'Agendados', explica: 'Tienen la cita por delante. Llámales en cuanto reserven y apunta el resultado: así llegan sabiendo que hay alguien esperándoles.' },
  nopresentados: { titulo: 'No presentados', explica: 'Reservaron y no vinieron (o cancelaron). Están pendientes de una llamada para recuperarles. Si hablas con ellos y no les interesa, descártalos.' },
  descartados:   { titulo: 'Descartados', explica: 'Los habéis descartado vosotros después de hablar con ellos. Nadie llega aquí solo.' },
  vinieron:      { titulo: 'Vinieron', explica: 'Asistieron a la sesión.' },
};
let pestana = 'agendados';
try { pestana = localStorage.getItem('ses_pestana') || 'agendados'; } catch (e) {}
const abiertas = new Set();
const seguimientos = new Map();
let datos = null;

async function api(url, opts) {
  const r = await fetch(url, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts || {}));
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok || (j && j.ok === false)) throw new Error((j && j.error) || `${r.status} ${r.statusText}`);
  return j;
}
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => (el.style.display = 'none'), 4500); }
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fecha = (iso) => iso ? new Date(iso).toLocaleString('es-ES', { timeZone: 'Europe/Madrid', weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const RES = { confirmada: '✅ Confirmó por teléfono', no_contesta: '📵 No contesta', reagenda: '🔁 Cambia de día', otra: '💬 Hablado' };

function personas() {
  const out = [];
  for (const s of (datos && datos.sesiones) || []) for (const a of s.asistentes) out.push({ ...a, inicio: s.inicio, pasada: s.pasada, joinUrl: s.joinUrl });
  return out.filter((a) => a.pestana === pestana).sort((x, y) => (pestana === 'agendados' ? x.inicio.localeCompare(y.inicio) : y.inicio.localeCompare(x.inicio)));
}

function chips(a) {
  const c = [];
  if (a.estadoSesion === 'cancelada') c.push('<span class="chip ko">Canceló</span>');
  if (a.pestana === 'agendados') {
    c.push(a.llamadas.length ? '<span class="chip ok">📞 Llamado</span>' : '<span class="chip ko">📞 Falta llamarle</span>');
    c.push(a.confirmada ? '<span class="chip ok">✔ Confirmó</span>' : '<span class="chip warn">Sin confirmar</span>');
  }
  if (a.pestana === 'nopresentados') c.push(a.llamadas.length ? `<span class="chip">📞 ${a.llamadas.length} llamada(s)</span>` : '<span class="chip ko">📞 Falta llamarle</span>');
  if (a.oportunidad > 1) c.push(`<span class="chip ${a.oportunidad >= 3 ? 'ko' : 'warn'}">${a.oportunidad}ª oportunidad</span>`);
  if (a.formado) c.push('<span class="chip ok">Vio la presentación</span>');
  if (a.riesgo === 'alto' && a.pestana === 'agendados') c.push('<span class="chip ko">⚠ Riesgo de no venir</span>');
  return c.join('');
}

function detalleHTML(a, sg) {
  const tel = String(a.telefono || '').replace(/\D/g, '');
  const acc = [];
  if (tel) acc.push(`<a class="btn prim" href="tel:+${tel}">📞 Llamar</a>`, `<a class="btn" href="https://wa.me/${tel}" target="_blank" rel="noopener">📱 WhatsApp desde mi móvil</a>`);
  if (a.pestana !== 'descartados') {
    acc.push(`<button data-acc="llamada" data-res="confirmada" data-id="${a.leadId}" class="verde">✅ Llamado: confirma</button>`);
    acc.push(`<button data-acc="llamada" data-res="no_contesta" data-id="${a.leadId}">📵 No contesta</button>`);
    acc.push(`<button data-acc="llamada" data-res="reagenda" data-id="${a.leadId}">🔁 Cambia de día</button>`);
    acc.push(`<button data-acc="descartar" data-id="${a.leadId}" class="rojo">✖ Descartar (no le interesa)</button>`);
  } else {
    acc.push(`<button data-acc="recuperar" data-id="${a.leadId}">↩ Recuperar</button>`);
  }
  if (a.pestana === 'agendados') acc.push(`<button data-acc="siguiente" data-id="${a.leadId}">📨 Mandarle el recordatorio que toca</button>`);
  if (a.pasada && a.asistio !== true) acc.push(`<button data-acc="asistio" data-id="${a.leadId}">🤝 Sí vino</button>`);
  if (a.pestana === 'nopresentados' || a.pestana === 'descartados') acc.push(`<button data-acc="siguiente_dia" data-id="${a.leadId}">📅 Mandarle otro día</button>`);

  const llamadas = a.llamadas.length ? `<div class="llamadas">${a.llamadas.map((l) => `${fecha(l.ts)} · ${RES[l.resultado] || l.resultado}${l.nota ? ' · ' + esc(l.nota) : ''}`).join('<br>')}</div>` : '';
  const dudas = a.dudas && a.dudas.length ? `<div class="dudas"><b>Lo que dejó escrito:</b> ${a.dudas.map((d) => '«' + esc(d) + '»').join(' · ')}</div>` : '';
  let resto = '<p class="explica">Cargando…</p>';
  if (sg) {
    const ic = { hecho: '✅', pendiente: '⬜', fallo: '❌' };
    const ent = { enviado: '✓', entregado: '✓✓', leido: '✓✓ leído', fallido: '⚠ no llegó' };
    resto = `<div class="cols">
      <div><h3>Paso a paso</h3><ul class="pasos">${sg.pasos.map((p) => `<li><span>${ic[p.estado]}</span><span>${esc(p.titulo)}<span class="ts">${p.ts ? fecha(p.ts) : ''}</span>${p.detalle ? `<span class="det">${esc(p.detalle)}</span>` : ''}</span></li>`).join('')}</ul></div>
      <div><h3>Conversación</h3><div class="chat">${sg.conversacion.map((m) => `<div class="msg ${m.de}">${esc(m.texto)}<small>${m.de === 'lead' ? esc(a.nombre) : m.de === 'crm' ? 'Equipo' : 'Agente'} · ${fecha(m.ts)}${m.entrega ? ' · ' + ent[m.entrega] : ''}</small></div>`).join('') || '<p class="explica">Sin mensajes.</p>'}</div>
        <div class="escribir"><textarea id="txt-${a.leadId}" placeholder="${sg.ventanaAbierta ? 'Escribe un mensaje…' : 'Solo se le puede escribir si ha contestado en las últimas 24 h. Usa «Mandarle el recordatorio» o tu WhatsApp.'}" ${sg.ventanaAbierta ? '' : 'disabled'}></textarea><button class="prim" data-acc="mensaje" data-id="${a.leadId}" ${sg.ventanaAbierta ? '' : 'disabled'}>Enviar</button></div>
      </div></div>`;
  }
  return `${dudas}<div class="acciones">${acc.join('')}</div>${llamadas}<div style="margin-top:10px">${resto}</div>`;
}

function pintar() {
  if (!datos) return;
  const p = datos.resumen.pestanas || {};
  document.getElementById('tabs').innerHTML = Object.entries(PESTANAS).map(([k, v]) =>
    `<button class="tab ${k === pestana ? 'activa' : ''}" data-tab="${k}"><b>${p[k] || 0}</b><span>${v.titulo}</span>${k === 'agendados' && p.porLlamar ? `<span class="aviso">📞 ${p.porLlamar} sin llamar</span>` : ''}</button>`).join('');
  document.getElementById('explica').textContent = PESTANAS[pestana].explica;
  const lista = personas();
  document.getElementById('lista').innerHTML = lista.length ? lista.map((a) => `
    <div class="persona ${abiertas.has(a.leadId) ? 'abierta' : ''}" id="p-${a.leadId}">
      <div class="fila" data-toggle="${a.leadId}"><span class="nombre">${esc(a.nombre)}</span><span class="cuando">${fecha(a.inicio)}</span><span class="tel">+${esc(String(a.telefono).replace(/\D/g, ''))}</span><span class="chips">${chips(a)}</span></div>
      <div class="detalle" id="d-${a.leadId}">${abiertas.has(a.leadId) ? detalleHTML(a, seguimientos.get(a.leadId)) : ''}</div>
    </div>`).join('') : `<div class="vacio">No hay nadie en «${PESTANAS[pestana].titulo}».</div>`;
}

async function cargar() {
  try {
    datos = await api('/api/sesiones');
    pintar();
    for (const id of abiertas) cargarSeguimiento(id);
    try {
      const st = await (await fetch('/api/system/status')).json();
      const sync = st.calendly && st.calendly.sync;
      document.getElementById('nota').innerHTML = sync && !sync.activo ? '<div class="nota">⚠ Las reservas nuevas de Calendly no están entrando solas. Avisa a Diego.</div>' : '';
    } catch (e) {}
  } catch (e) { toast('No se pudo cargar: ' + e.message); }
}
async function cargarSeguimiento(id) {
  try { seguimientos.set(id, await api(`/api/sesiones/${id}/seguimiento`)); pintar(); } catch (e) {}
}

document.addEventListener('click', async (ev) => {
  const t = ev.target.closest('[data-tab]');
  if (t) { pestana = t.dataset.tab; try { localStorage.setItem('ses_pestana', pestana); } catch (e) {} pintar(); return; }
  const f = ev.target.closest('[data-toggle]');
  if (f && !ev.target.closest('button,a')) { const id = f.dataset.toggle; if (abiertas.has(id)) abiertas.delete(id); else { abiertas.add(id); cargarSeguimiento(id); } pintar(); return; }
  const b = ev.target.closest('button[data-acc]'); if (!b) return;
  const id = b.dataset.id, acc = b.dataset.acc;
  try {
    b.disabled = true;
    if (acc === 'llamada') {
      const nota = b.dataset.res === 'confirmada' ? '' : (prompt('¿Alguna nota de la llamada? (opcional)') || '');
      await api(`/api/sesiones/${id}/llamada`, { method: 'POST', body: JSON.stringify({ resultado: b.dataset.res, nota }) });
      toast('Llamada apuntada');
    } else if (acc === 'descartar') {
      const motivo = prompt('¿Por qué se descarta? (por ejemplo: no le interesa)');
      if (motivo === null) return;
      await api(`/api/sesiones/${id}/descartar`, { method: 'POST', body: JSON.stringify({ motivo }) }); toast('Descartado');
    } else if (acc === 'recuperar') {
      await api(`/api/sesiones/${id}/recuperar`, { method: 'POST', body: '{}' }); toast('Recuperado');
    } else if (acc === 'siguiente') {
      await api(`/api/sesiones/${id}/siguiente`, { method: 'POST', body: '{}' }); toast('Recordatorio enviado');
    } else if (acc === 'siguiente_dia') {
      await api(`/api/sesiones/${id}/otro-dia`, { method: 'POST', body: '{}' }); toast('Le hemos mandado los días disponibles');
    } else if (acc === 'asistio') {
      if (!confirm('¿Confirmas que sí vino a la sesión?')) return;
      await api(`/api/sesiones/${id}/asistencia`, { method: 'POST', body: JSON.stringify({ asistio: true }) }); toast('Apuntado: vino');
    } else if (acc === 'mensaje') {
      const ta = document.getElementById('txt-' + id); const texto = (ta.value || '').trim(); if (!texto) return toast('Escribe el mensaje');
      await api(`/api/sesiones/${id}/mensaje`, { method: 'POST', body: JSON.stringify({ texto }) }); ta.value = ''; toast('Mensaje enviado');
    }
    await cargar();
  } catch (e) { toast(e.message); } finally { b.disabled = false; }
});

cargar();
setInterval(cargar, 60 * 1000);
</script>
</body>
</html>
